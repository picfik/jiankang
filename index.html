<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a7d55">
  <meta name="description" content="个人健康管理打卡 PWA：血糖、饮水、腰痛、运动记录，离线可用">
  <title>健康打卡</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <h1>健康打卡</h1>
      <span id="header-date"></span>
    </div>
    <nav class="app-nav" id="nav">
      <a href="#/today" data-nav="today">今日</a>
      <a href="#/history" data-nav="history">历史</a>
      <a href="#/settings" data-nav="settings">设置</a>
    </nav>
  </header>

  <main id="app">
    <div class="loading">加载中…</div>
  </main>

  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>

  <noscript>本应用需要启用 JavaScript。</noscript>
  <script src="oss-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
